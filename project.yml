name: DouyinLivePhoto
options:
  bundleIdPrefix: com.example.douyinlivephoto
  deploymentTarget:
    iOS: "15.0"
targets:
  DouyinLivePhoto:
    type: application
    platform: iOS
    sources:
      - path: DouyinLivePhoto
      - path: Shared
    dependencies:
      - target: DouyinLivePhotoShareExtension   # 让共享扩展被打进 App 包
    info:
      properties:
        NSPhotoLibraryAddUsageDescription: 用于保存下载的抖音视频、图片与实况图
        UILaunchScreen: {}
    entitlements:
      path: DouyinLivePhoto/DouyinLivePhoto.entitlements
  DouyinLivePhotoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DouyinLivePhotoShareExtension
      - path: Shared
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionActivationRule:
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsFileWithMaxCount: 0
        NSPhotoLibraryAddUsageDescription: 用于保存下载的抖音视频、图片与实况图
    entitlements:
      path: DouyinLivePhotoShareExtension/DouyinLivePhotoShareExtension.entitlements
schemes:
  DouyinLivePhoto:
    build:
      targets:
        DouyinLivePhoto: all
